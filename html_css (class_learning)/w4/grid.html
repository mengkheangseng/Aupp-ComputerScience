<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .light-pink {
        background-color: pink;
      }
      .pink {
        background-color: rgb(195, 13, 140);
      }
      .meduim-pink {
        background-color: rgb(155, 9, 67);
      }
      .dark-pink {
        background-color: rgb(105, 4, 88);
      }
      .layout-container {
        display: grid;
        grid-template-columns: 1fr 3.5fr 0.7fr;
        grid-template-areas:
          "header header header"
          "menu menu menu"
          "left main right"
          "footer footer footer";
        grid-template-rows: 90px 50px minmax(400px, auto) 60px;
        max-width: 1000px;
        width: 100%;
        gap: 20px;
        margin: 0 auto;
      }
      .header {
        grid-area: header;
      }
      .menu {
        grid-area: menu;
        overflow: hidden
      }
      .sidebar-right {
        grid-area: right;
        height: 100%;
      }
      .sidebar-right-space {
        height: 140px;
        padding: 14px
      }
      .main-content {
        grid-area: main;
        padding: 10px; 
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .main-space {
        height: 70px;
        padding: 14px
      }
      .sidebar-left {
        grid-area: left;
        display: flex;
        flex-direction: column;
        gap: 10px;
        height: 100%;
      }
      .sidebar-left-space {
        height: 40px;
        padding: 14px
      }
      .footer {
        grid-area: footer;
      }
    </style>
  </head>
  <body>
    <div class="layout-container">
      <div class="header meduim-pink">HEADER</div>
      <div class="menu dark-pink">MENU</div>
      <!-- sidebar-left -->
      <div class="sidebar-left">
        <div class="pink sidebar-left-space">Aside 1</div>
        <div class="pink sidebar-left-space">Aside 2</div>
        <div class="pink sidebar-left-space">Aside 3</div>
      </div>
      <!-- Main Content -->
      <div class="pink main-content">
        <h1>Main Content</h1>
        <div class="light-pink main-space">Section 1</div>
        <div class="light-pink main-space">Section 2</div>
      </div>
      <!-- Sidebar-Right -->
      <div class="sidebar-right">
        <div class="pink sidebar-right-space">Aside 3</div>
      </div>
      <!-- Footer -->
      <div class="footer dark-pink">Footer</div>
    </div>
  </body>
</html>
